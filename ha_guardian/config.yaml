name: HA Guardian
version: "0.6.2"
slug: ha_guardian
description: Claude-powered home control over Telegram plus a security monitor that watches for attacks
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
homeassistant_api: true     # lets the add-on talk to HA through the Supervisor with its own token
hassio_api: true            # lets it read the HA core log as a fallback
hassio_role: homeassistant  # narrowest Supervisor role I expect to allow reading /core/logs (use `manager` if still 403)
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-home
panel_title: Guardian Chat
host_network: true          # needed only for the optional LAN device watcher
privileged:
  - NET_RAW                 # nmap ping scan (optional LAN device watcher)
map:
  - app_config:rw         # /config/config.yaml (allowlist and detector settings) lives here
options:
  anthropic_api_key: ""
  telegram_bot_token: ""
  telegram_chat_id: ""
  control_model: ""
  triage_model: ""
  mobile_notify_service: ""
  create_dashboard: true
  device_health_alerts: false
  internet_alerts: false
  display_players: "media_player.family_room_display"
  display_live: true
schema:
  anthropic_api_key: password?
  telegram_bot_token: password?
  telegram_chat_id: str?
  control_model: str?
  triage_model: str?
  mobile_notify_service: str?
  create_dashboard: bool?
  device_health_alerts: bool?
  internet_alerts: bool?
  display_players: str?
  display_live: bool?
